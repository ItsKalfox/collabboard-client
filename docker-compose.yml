version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      # This mounts your local code into the container so it hot-reloads when you save!
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      # Hot reloading for your React code
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
