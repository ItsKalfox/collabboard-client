info:
  name: Create Project
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:5000/api/projects
  body:
    type: json
    data: |
      {
        "name": "New Project",
        "description": "A brand new project",
        "status": "active"
      }
  auth:
    type: bearer
    token: <JWT_TOKEN>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
