info:
  name: Review Task
  type: http
  seq: 5

http:
  method: POST
  url: http://localhost:5000/api/tasks/101/review
  body:
    type: json
    data: |-
      {
        "comment": "Looks good, approved."
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
