docs: |
  ## Update Email

  Changes the authenticated user's email address. Requires current password verification.

  **Authentication:** Required (Bearer token)

  **Request Body:**
  - `email` (string, required) — New email address
  - `currentPassword` (string, required) — Current account password for verification

  **Successful Response (200):**
  ```json
  {
    "status": "success",
    "message": "Email updated successfully",
    "data": {
      "user": {
        "id": "...",
        "name": "John Doe",
        "email": "newemail@example.com"
      }
    }
  }
  ```

  **Error — Wrong Password (401):**
  ```json
  { "status": "error", "message": "Current password is incorrect" }
  ```

  **Error — Email Already Taken (409):**
  ```json
  { "status": "error", "message": "Email is already registered to another account" }
  ```
