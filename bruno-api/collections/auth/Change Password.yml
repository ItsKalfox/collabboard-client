meta:
  name: Change Password
  type: http
  seq: 8

http:
  method: PATCH
  url: http://localhost:5000/api/auth/password
  auth: bearer
  body: json

auth:
  bearer:
    token: "{{token}}"

body:
  json: |
    {
      "currentPassword": "oldpassword123",
      "newPassword": "newpassword456",
      "confirmNewPassword": "newpassword456"
    }

docs: |
  ## Change Password

  Changes the authenticated user's password. Requires the current password and matching new passwords.

  **Authentication:** Required (Bearer token)

  **Request Body:**
  - `currentPassword` (string, required) — User's current password
  - `newPassword` (string, required) — New password (min. 6 characters)
  - `confirmNewPassword` (string, required) — Must match `newPassword`

  **Successful Response (200):**
  ```json
  {
    "status": "success",
    "message": "Password changed successfully"
  }
  ```

  **Error — Wrong Current Password (401):**
  ```json
  { "status": "error", "message": "Current password is incorrect" }
  ```

  **Error — Password Mismatch (400):**
  ```json
  { "status": "error", "message": "New password and confirm password do not match" }
  ```

  **Error — Password Too Short (400):**
  ```json
  { "status": "error", "message": "New password must be at least 6 characters" }
  ```
